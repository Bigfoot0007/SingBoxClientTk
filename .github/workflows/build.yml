name: build-installers

# Push a tag (v*) or run "Run workflow" manually to build all platforms.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            sb_asset: linux-amd64
          - os: windows-latest
            label: Windows
            sb_asset: windows-amd64
          - os: macos-latest
            label: macOS
            sb_asset: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Single source of truth for the app version: the git tag.
      - name: Resolve app version
        if: runner.os != 'Windows'
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=dev-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Resolve app version (Windows)
        if: runner.os == 'Windows'
        run: |
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = "dev-$env:GITHUB_RUN_NUMBER"
          }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      # Bundle the engine: the installer carries its own sing-box, so
      # users never install one and the 1.14 config contract can't drift.
      - name: Fetch bundled sing-box (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          SINGBOX_VER: "1.14.4"   # bump together with core/bundled_bin.py + config.py contract
        run: |
          curl -fsSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-${{ matrix.sb_asset }}.tar.gz"
          tar -xzf sb.tgz
          mkdir -p assets
          cp "sing-box-${SINGBOX_VER}-${{ matrix.sb_asset }}/sing-box" assets/sing-box
          chmod +x assets/sing-box
          assets/sing-box version

      - name: Fetch bundled sing-box (Windows)
        if: runner.os == 'Windows'
        env:
          SINGBOX_VER: "1.14.4"   # keep in sync with the step above + core/bundled_bin.py
        run: |
          $v = $env:SINGBOX_VER
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v$v/sing-box-$v-windows-amd64.zip" -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sb
          New-Item -ItemType Directory -Force assets | Out-Null
          Copy-Item "sb/sing-box-$v-windows-amd64/sing-box.exe" assets/sing-box.exe
          assets/sing-box.exe version

      - name: Build with PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm SingBoxClient.spec

      # Smoke test: actually start the app. Compile-green caught a broken
      # __init__ (v1.1.0) that crashed at first launch — a booting process
      # is the release gate. Empty runner profile = no nodes = no connect.
      - name: Smoke test (Windows, launch for 12 s)
        if: runner.os == 'Windows'
        run: |
          $p = Start-Process -FilePath "dist\SingBoxClient\SingBoxClient.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { "app died: exit $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          echo SMOKE_OK

      - name: Smoke test (macOS, launch for 12 s)
        if: runner.os == 'macOS'
        run: |
          dist/SingBoxClient.app/Contents/MacOS/SingBoxClient & pid=$!
          sleep 12
          kill -0 $pid || { echo "app died"; exit 1; }
          kill $pid
          echo SMOKE_OK

      - name: Smoke test (Linux, xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a dist/SingBoxClient/SingBoxClient & pid=$!
          sleep 14
          kill -0 $pid || { echo "app died"; cat dist/SingBoxClient/singbox.log 2>/dev/null; exit 1; }
          kill $pid
          echo SMOKE_OK

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-installers
          tar czf dist-installers/SingBoxClient-linux-x64.tar.gz -C dist SingBoxClient

      - name: Package (Windows — Inno Setup installer)
        if: runner.os == 'Windows'
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer.iss
          New-Item -ItemType Directory -Force dist-installers | Out-Null
          Copy-Item Output\SingBoxClient-win-x64-setup.exe dist-installers\

      - name: Package (macOS — ad-hoc signed dmg)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/SingBoxClient.app
          rm -rf /tmp/sbc-stage && mkdir -p /tmp/sbc-stage
          cp -R dist/SingBoxClient.app /tmp/sbc-stage/
          ln -s /Applications /tmp/sbc-stage/Applications
          mkdir -p dist-installers
          hdiutil create -volname "SingBox Client" -srcfolder /tmp/sbc-stage \
            -ov -format UDZO dist-installers/SingBoxClient-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SingBoxClient-${{ matrix.label }}
          path: dist-installers/

  # Tag builds only: collect the three artifacts into a permanent GitHub
  # Release (Artifacts expire; Release assets do not).
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SingBoxClient-*
          path: release-files/
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            -R "$GITHUB_REPOSITORY" \
            --title "SingBox Client $GITHUB_REF_NAME" \
            --generate-notes
